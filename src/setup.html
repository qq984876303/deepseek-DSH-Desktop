<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'"
    />
    <title>DSH Desktop setup</title>
    <style>
      html, body { margin: 0; height: 100%; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: #1e1e1e;
        color: #e6e6e6;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .card { width: 380px; padding: 24px; }
      h1 { font-size: 16px; font-weight: 500; margin: 0 0 8px; }
      p { font-size: 13px; color: #a6a6a6; margin: 0 0 18px; line-height: 1.5; }
      label { font-size: 12px; color: #a6a6a6; display: block; margin-bottom: 6px; }
      input {
        width: 100%;
        box-sizing: border-box;
        padding: 8px 10px;
        border-radius: 6px;
        border: 1px solid #444;
        background: #2a2a2a;
        color: #e6e6e6;
        font-size: 13px;
      }
      button {
        margin-top: 14px;
        width: 100%;
        padding: 9px;
        border: 0;
        border-radius: 6px;
        background: #7F77DD;
        color: #fff;
        font-size: 13px;
        cursor: pointer;
      }
      button:hover { background: #6f66d0; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>DSH Desktop</h1>
      <p>
        Enter your DeepSeek API key. It is encrypted with macOS Keychain and passed
        to the local dsh runtime.
      </p>
      <label for="key">DeepSeek API key</label>
      <input id="key" type="password" placeholder="sk-..." autocomplete="off" />
      <button id="save">Save and start</button>
    </div>
    <script>
      const input = document.getElementById('key');
      const btn = document.getElementById('save');
      function submit() {
        const v = (input.value || '').trim();
        if (!v) { input.focus(); return; }
        window.dshDesktop.saveKey(v);
      }
      btn.addEventListener('click', submit);
      input.addEventListener('keydown', (e) => { if (e.key === 'Enter') submit(); });
      input.focus();
    </script>
  </body>
</html>
